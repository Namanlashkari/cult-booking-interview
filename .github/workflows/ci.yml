name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run demo app
        run: chmod +x run-app.sh find-java.sh && ./run-app.sh
      - name: Compile shipped tests (suite is expected to include known interview bugs)
        run: |
          chmod +x find-java.sh
          source ./find-java.sh
          mkdir -p out
          "$JAVAC" -d out $(find src/main/java src/test/java -name '*.java')
          echo "compiled interview suite"
